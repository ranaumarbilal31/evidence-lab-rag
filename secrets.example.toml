# Copy to .streamlit/secrets.toml locally OR paste into Community Cloud Secrets.
# Never put real credentials in this example or in chat.
GEMINI_API_KEY = ""
# Set true ONLY after checking that this project's billing is disabled.
FREE_TIER_CONFIRMED = false
# Copy the ACTIVE limits for each model from Google AI Studio. Zero disables live use.
# Unverified application budgets are not provider-confirmed quotas.
# Source: https://ai.google.dev/gemini-api/docs/rate-limits (reviewed 2026-09-23).
GEN_RPM = 0
GEN_TPM = 0
GEN_RPD = 0
EMBED_RPM = 0
EMBED_TPM = 0
EMBED_RPD = 0

# Pauses hosted shared requests only; personal connections and saved demos work.
RESEARCH_PAUSE_SHARED = false

# Optional pool: copy this block up to 10 times, one block per owner-supplied key.
# Enabled pool entries replace the legacy GEMINI_API_KEY above.
# Keys in the SAME Google project MUST have the SAME project_id. Their quotas
# are shared, never multiplied. Conflicting budgets use the lowest value.
# All entries use the same generation and embedding models from rag/config.py.
# Fill limits from AI Studio. Zero disables a key. Never treat public estimates
# as confirmed project quotas; see MODEL_QUOTA_REVIEW.md.
# [[shared_keys]]
# api_key = ""
# project_id = "your-google-project-id"
# enabled = false
# free_tier_confirmed = false # Only after checking this project's billing.
# gen_rpm = 0
# gen_tpm = 0
# gen_rpd = 0
# embed_rpm = 0
# embed_tpm = 0
# embed_rpd = 0
